# ProXam Firewall Whitelist
# Erlaubt HTTP/HTTPS-Zugriff auf den ProXam-Backend-Server.
# Wird von lernstick-firewall (Squid-Proxy) eingelesen.
#
# Format: ^proto://host (Regex-Präfix)
# Diese Datei wird beim Start von searchExamServer automatisch befüllt.
# Der Eintrag hier dient als Fallback/Basis-Whitelist.
^https://api\.proxam\.at
