# ProXam Exam Client — Serverkonfiguration
#
# Diese Datei wird von searchExamServer gelesen wenn kein mDNS-Server
# gefunden wird. IP und Host auf den ProXam-Server anpassen.
#
# Für mDNS-Discovery (Schule mit lokalem Server): diese Datei löschen oder
# auskommentieren — der Client scannt dann das Netzwerk automatisch.

gladosIp="0.0.0.0"
gladosHost="api.proxam.at"
gladosPort=443
gladosProto="https"
gladosDesc="ProXam Prüfungsserver"

actionDownload='glados/index.php/ticket/download/{token}'
actionFinish='glados/index.php/ticket/finish/{token}'
actionNotify='glados/index.php/ticket/notify/{token}?state={state}'
actionSSHKey='glados/index.php/ticket/ssh-key'
actionMd5='glados/index.php/ticket/md5/{token}'
actionConfig='glados/index.php/ticket/config/{token}'
