# ProXam Exam Client — Serverkonfiguration
#
# Diese Datei wird von searchExamServer gelesen wenn kein mDNS-Server
# gefunden wird. IP und Host auf den ProXam-Server anpassen.
#
# Für mDNS-Discovery (Schule mit lokalem Server): diese Datei löschen oder
# auskommentieren — der Client scannt dann das Netzwerk automatisch.

serverIp="0.0.0.0"
serverHost="api.proxam.at"
serverPort=443
serverProto="https"
serverDesc="ProXam Prüfungsserver"

actionDownload='proxam/ticket/download/{token}'
actionFinish='proxam/ticket/finish/{token}'
actionNotify='proxam/ticket/notify/{token}?state={state}'
actionSSHKey='proxam/ticket/ssh-key'
actionMd5='proxam/ticket/md5/{token}'
actionConfig='proxam/ticket/config/{token}'
